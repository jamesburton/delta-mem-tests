[project]
name = "delta-mem-tests"
version = "0.0.1"
description = "Independent reproduction of declare-lab/delta-Mem on RTX 3060 / Windows 11"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.5.1",
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "huggingface-hub",
    "einops",
    "pydantic",
    "tqdm",
    "ninja",
    "psutil",
    # KV-cache quantization for the TurboQuant + delta-mem experiment.
    # Provides TurboQuantCache (DynamicCache subclass) with 3/4-bit quantization
    # of K/V tensors plus a 128-token FP16 residual window. Used only when
    # --turboquant-bits N is passed to run.locomo_eval.
    "turboquant>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["run"]

# Route torch through the PyTorch cu121 index so `uv run` / `uv sync` always
# selects the CUDA-enabled wheel, not PyPI's CPU build. The 3060 (Ampere, sm_86)
# is fully supported by the cu121 wheels.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
