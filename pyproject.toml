[project]
name = "delta-mem-tests"
version = "0.0.1"
description = "Independent reproduction of declare-lab/delta-Mem on RTX 3060 / Windows 11"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.5.1",
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "huggingface-hub",
    "einops",
    "pydantic",
    "tqdm",
    "ninja",
    "psutil",
    # KV-cache quantization for the TurboQuant + delta-mem experiment.
    # Provides TurboQuantCache (DynamicCache subclass) with 3/4-bit quantization
    # of K/V tensors plus a 128-token FP16 residual window. Used when
    # --kv-cache-backend turboquant is passed to run.locomo_eval.
    "turboquant>=0.2.0",
    # KIVI-style 2/4-bit KV-cache quantization backend used by
    # transformers.cache_utils.QuantizedCache(backend="quanto"). Used when
    # --kv-cache-backend quanto is passed. NOTE: on Windows optimum-quanto's
    # JIT-compiled CUDA kernels (gemm_cuda.cu) use GCC-style __asm__ inline
    # assembly that MSVC can't parse — quanto is effectively Linux-only at
    # this version. Listed for completeness but expect failure on Windows;
    # use hqq backend instead.
    "optimum-quanto>=0.2.5",
    # 1-8 bit KV-cache quantization backend used by
    # transformers.cache_utils.QuantizedCache(backend="hqq"). Ships
    # pre-built CUDA kernels via the hqq package, so no JIT compile on
    # the host. Used when --kv-cache-backend hqq is passed.
    "hqq>=0.2.0",
    # optimum-quanto pulls torch.utils.cpp_extension which imports
    # setuptools at module load time. Make the dep explicit so uv resolves
    # it even though Python 3.12+ removed setuptools from the stdlib.
    "setuptools",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["run"]

# Route torch through the PyTorch cu121 index so `uv run` / `uv sync` always
# selects the CUDA-enabled wheel, not PyPI's CPU build. The 3060 (Ampere, sm_86)
# is fully supported by the cu121 wheels.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
